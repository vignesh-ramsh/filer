[project]
name = "filer"
version = "0.1.0"
description = "ARC business plugin: filer"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34"]

[project.entry-points."arc.plugins"]
filer = "filer:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filer"]
